<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Космический тренажёр: Разложение многочленов | Мягкая математика</title>
<style>
  :root{
    --space-deep:#050813; --space-bg:#0a0e1a; --space-panel:#0f1524;
    --space-border:#1e2942; --cyan:#00d9ff; --cyan-dim:#0891b2;
    --mars:#ff6b35; --nebula:#a855f7; --gold:#fbbf24;
    --green:#10b981; --red:#ef4444;
    --text:#e2e8f0; --text-dim:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Open Sans','Segoe UI',system-ui,sans-serif;
    background:var(--space-deep);color:var(--text);
    min-height:100vh;padding:16px;line-height:1.5;
    overflow-x:hidden;position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 60% 70%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 10%, var(--cyan), transparent),
      radial-gradient(1px 1px at 10% 80%, #fff, transparent),
      radial-gradient(2px 2px at 45% 45%, #fff, transparent),
      radial-gradient(1px 1px at 90% 50%, var(--gold), transparent),
      radial-gradient(1.5px 1.5px at 30% 15%, #fff, transparent);
    background-size:200% 200%;
    animation:stars 120s linear infinite;
    z-index:0;pointer-events:none;opacity:.7;
  }
  body::after{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(168,85,247,.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 70%, rgba(0,217,255,.1) 0%, transparent 40%);
    z-index:0;pointer-events:none;
  }
  @keyframes stars{
    0%{background-position:0 0, 40% 60%, 130% 270%, 180% 130%, 60% 40%, 250% 100%, 30% 30%;}
    100%{background-position:200% 200%, 240% 260%, 330% 470%, 380% 330%, 260% 240%, 450% 300%, 230% 230%;}
  }

  .app{max-width:1150px;margin:0 auto;position:relative;z-index:1;}
  h1,h2,h3,h4{font-family:'Montserrat','Segoe UI',sans-serif;letter-spacing:.5px;}

  /* HUD */
  .hud{
    display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
    background:rgba(15,21,36,.75);border:1px solid var(--space-border);
    border-radius:16px;padding:14px 20px;margin-bottom:12px;
    backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(0,217,255,.08);
  }
  .hud-left{display:flex;align-items:center;gap:14px;}
  .hud-avatar{
    width:52px;height:52px;border-radius:14px;
    background:radial-gradient(circle at 30% 30%, var(--cyan), var(--cyan-dim));
    display:flex;align-items:center;justify-content:center;font-size:24px;
    box-shadow:0 0 25px rgba(0,217,255,.5), inset 0 0 15px rgba(255,255,255,.2);
    position:relative;animation:avatarPulse 3s infinite;
  }
  @keyframes avatarPulse{
    0%,100%{box-shadow:0 0 25px rgba(0,217,255,.5), inset 0 0 15px rgba(255,255,255,.2);}
    50%{box-shadow:0 0 40px rgba(0,217,255,.8), inset 0 0 20px rgba(255,255,255,.3);}
  }
  .hud-avatar .lvl{
    position:absolute;bottom:-4px;right:-4px;
    background:var(--gold);color:var(--space-deep);
    font-size:11px;font-weight:900;padding:2px 7px;border-radius:9px;
    border:2px solid var(--space-deep);box-shadow:0 0 10px rgba(251,191,36,.6);
  }
  .hud-info{flex:1;min-width:140px;}
  .hud-name{font-size:13px;font-weight:800;color:var(--cyan);margin-bottom:4px;letter-spacing:.5px;}
  .hud-xp-bar{
    height:8px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;
    border:1px solid rgba(0,217,255,.2);position:relative;
  }
  .hud-xp-fill{
    height:100%;background:linear-gradient(90deg, var(--cyan), var(--nebula));
    width:0%;transition:width .6s ease;border-radius:6px;position:relative;overflow:hidden;
  }
  .hud-xp-fill::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
    animation:shine 2s infinite;
  }
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .hud-xp-text{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-top:3px;}

  .hud-center{display:flex;gap:10px;}
  .hud-stat{
    background:rgba(0,0,0,.35);border:1px solid var(--space-border);
    border-radius:10px;padding:6px 14px;text-align:center;min-width:76px;
  }
  .hud-stat .v{font-size:17px;font-weight:900;color:var(--gold);display:block;line-height:1.1;}
  .hud-stat .l{font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;}

  .hud-right{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;align-items:center;}

  .hud-btn{
    background:rgba(0,0,0,.35);border:1px solid var(--space-border);
    border-radius:10px;padding:6px 10px;cursor:pointer;
    color:var(--text);font-family:inherit;font-size:13px;
    transition:.2s;
  }
  .hud-btn:hover{border-color:var(--cyan);background:rgba(0,217,255,.1);}
  .hud-btn.active{border-color:var(--gold);background:rgba(251,191,36,.15);}

  .hud-ad{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);
    border-radius:20px;padding:5px 12px;
    font-size:11px;font-weight:700;color:var(--gold);
    text-decoration:none;transition:.2s;cursor:pointer;white-space:nowrap;
  }
  .hud-ad:hover{
    background:rgba(251,191,36,.2);transform:translateY(-1px);
    box-shadow:0 0 15px rgba(251,191,36,.3);
  }
  .hud-ad .dot{
    width:6px;height:6px;border-radius:50%;background:var(--gold);
    animation:dotPulse 2s infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.5;transform:scale(1.3);}
  }

  .timer-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(0,217,255,.1);border:1px solid rgba(0,217,255,.3);
    border-radius:10px;padding:6px 12px;
    font-size:12px;font-weight:800;color:var(--cyan);
    font-family:'Courier New',monospace;
  }

  /* Табы */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tab{
    background:rgba(15,21,36,.75);border:1px solid var(--space-border);
    border-radius:12px;padding:11px 16px;cursor:pointer;transition:.25s;
    font-size:12.5px;color:var(--text-dim);font-weight:700;
    display:flex;align-items:center;gap:7px;
    backdrop-filter:blur(10px);
  }
  .tab:hover{border-color:var(--cyan);color:var(--text);transform:translateY(-2px);}
  .tab.active{
    background:linear-gradient(135deg, rgba(0,217,255,.2), rgba(168,85,247,.15));
    border-color:var(--cyan);color:var(--text);
    box-shadow:0 0 20px rgba(0,217,255,.3);
  }
  .tab .cnt{
    background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px;
    font-size:10px;font-weight:900;color:var(--cyan);
  }
  .tab.done{
    border-color:var(--green);
    background:linear-gradient(135deg, rgba(16,185,129,.15), rgba(0,217,255,.08));
  }
  .tab.done .cnt{color:var(--green);}

  /* Реклама-баннер между табами и контентом */
  .ad-banner{
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg, rgba(251,191,36,.1), rgba(255,107,53,.08));
    border:1px solid rgba(251,191,36,.25);
    border-radius:14px;padding:10px 16px;margin-bottom:14px;
    position:relative;overflow:hidden;
  }
  .ad-banner::before{
    content:'✦';position:absolute;right:-30px;top:-30px;
    font-size:120px;color:rgba(251,191,36,.08);
    pointer-events:none;
  }
  .ad-banner-icon{font-size:26px;flex-shrink:0;}
  .ad-banner-text{flex:1;font-size:12.5px;line-height:1.45;}
  .ad-banner-text strong{color:var(--gold);display:block;margin-bottom:1px;}
  .ad-banner-text span{color:var(--text-dim);font-size:11.5px;}
  .ad-banner-cta{
    background:linear-gradient(135deg, var(--gold), #f59e0b);
    color:var(--space-deep);text-decoration:none;
    padding:7px 14px;border-radius:9px;
    font-weight:800;font-size:11.5px;
    white-space:nowrap;transition:.2s;
    position:relative;z-index:1;
  }
  .ad-banner-cta:hover{transform:scale(1.05);box-shadow:0 4px 14px rgba(251,191,36,.5);}

  /* Панель */
  .panel{
    background:rgba(15,21,36,.75);border:1px solid var(--space-border);
    border-radius:20px;padding:22px;backdrop-filter:blur(12px);
    animation:fadeIn .5s ease;box-shadow:0 0 40px rgba(0,217,255,.05);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .panel-head{margin-bottom:20px;}
  .panel-head h2{color:var(--cyan);font-size:22px;margin-bottom:6px;text-shadow:0 0 20px rgba(0,217,255,.5);}
  .panel-head .sub{color:var(--text-dim);font-size:13px;}

  /* DnD */
  .dnd-intro{
    background:rgba(168,85,247,.1);border-left:3px solid var(--nebula);
    border-radius:10px;padding:12px 16px;margin-bottom:18px;
    font-size:13px;color:var(--text);line-height:1.6;
  }
  .dnd-intro strong{color:var(--nebula);}
  .dnd-chips{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:10px;margin-bottom:20px;padding:16px;
    background:rgba(0,0,0,.3);border-radius:14px;
    border:1px dashed rgba(0,217,255,.2);min-height:80px;
  }
  .chip{
    background:linear-gradient(135deg, rgba(30,41,66,.9), rgba(15,21,36,.9));
    border:1px solid var(--space-border);border-radius:12px;
    padding:14px 16px;cursor:grab;font-family:'Courier New',monospace;
    font-size:15px;font-weight:700;color:var(--text);transition:.2s;
    user-select:none;text-align:center;position:relative;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
  }
  .chip:hover{
    border-color:var(--cyan);box-shadow:0 0 20px rgba(0,217,255,.4);
    transform:translateY(-2px);
  }
  .chip.dragging{opacity:.4;}
  .chip.selected{
    border-color:var(--gold);box-shadow:0 0 25px rgba(251,191,36,.6);
    transform:scale(1.03);
  }
  .chip.used{opacity:.15;pointer-events:none;transform:scale(.9);}

  .dnd-zones{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px;}
  @media(max-width:800px){.dnd-zones{grid-template-columns:1fr;}}
  .dnd-zone{
    background:rgba(0,0,0,.3);border:2px dashed var(--space-border);
    border-radius:16px;padding:14px;min-height:180px;
    transition:.25s;cursor:pointer;
  }
  .dnd-zone.zone-factor{border-color:rgba(0,217,255,.4);}
  .dnd-zone.zone-fsu{border-color:rgba(251,191,36,.4);}
  .dnd-zone.zone-group{border-color:rgba(168,85,247,.4);}
  .dnd-zone.over{background:rgba(0,217,255,.1);border-color:var(--cyan);transform:scale(1.02);}
  .zone-head{
    text-align:center;margin-bottom:12px;padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  .zone-icon{font-size:28px;display:block;margin-bottom:4px;}
  .zone-name{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
  .zone-factor .zone-name{color:var(--cyan);}
  .zone-fsu .zone-name{color:var(--gold);}
  .zone-group .zone-name{color:var(--nebula);}
  .zone-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .zone-items{display:flex;flex-direction:column;gap:6px;}
  .zone-item{
    background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);
    border-radius:8px;padding:8px 10px;font-family:'Courier New',monospace;
    font-size:13px;color:#a7f3d0;animation:popIn .3s ease;font-weight:700;text-align:center;
  }
  @keyframes popIn{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* Quiz */
  .quiz{
    background:rgba(0,0,0,.3);border:1px solid var(--space-border);
    border-radius:16px;padding:20px;margin-bottom:14px;transition:.2s;
  }
  .quiz.solved{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05);}
  .quiz-num{
    display:inline-block;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    color:var(--space-deep);font-size:12px;font-weight:900;
    padding:3px 10px;border-radius:8px;margin-bottom:12px;
    box-shadow:0 0 15px rgba(0,217,255,.4);
  }
  .quiz-q{font-size:15px;line-height:1.6;margin-bottom:14px;color:var(--text);}
  .quiz-q .math{
    font-family:'Courier New',monospace;
    background:rgba(0,217,255,.1);color:#bfffe0;
    padding:3px 10px;border-radius:6px;
    border:1px solid rgba(0,217,255,.2);display:inline-block;font-weight:700;
  }
  .quiz-opts{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;}
  @media(max-width:600px){.quiz-opts{grid-template-columns:1fr;}}
  .quiz-opt{
    background:rgba(30,41,66,.6);border:1px solid var(--space-border);
    border-radius:10px;padding:12px 16px;color:var(--text);
    font-family:'Courier New',monospace;font-size:14px;font-weight:700;
    cursor:pointer;transition:.2s;text-align:left;
  }
  .quiz-opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(0,217,255,.1);transform:translateX(3px);}
  .quiz-opt:disabled{cursor:not-allowed;}
  .quiz-opt.correct{
    background:rgba(16,185,129,.2);border-color:var(--green);
    color:#a7f3d0;box-shadow:0 0 20px rgba(16,185,129,.4);
  }
  .quiz-opt.wrong{
    background:rgba(239,68,68,.15);border-color:var(--red);color:#fca5a5;
  }

  /* Open */
  .open{
    background:rgba(0,0,0,.3);border:1px solid var(--space-border);
    border-radius:16px;padding:20px;margin-bottom:14px;
  }
  .open.solved{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.05);}
  .open-q{font-size:15px;line-height:1.6;margin-bottom:14px;}
  .open-q .math{
    font-family:'Courier New',monospace;
    background:rgba(168,85,247,.15);color:#e9d5ff;
    padding:3px 10px;border-radius:6px;
    border:1px solid rgba(168,85,247,.3);display:inline-block;font-weight:700;
  }
  .open-row{display:flex;gap:10px;flex-wrap:wrap;}
  .open-input{
    flex:1;min-width:140px;
    background:rgba(15,21,36,.8);border:1px solid var(--space-border);
    border-radius:10px;padding:12px 16px;color:var(--text);
    font-size:14px;font-family:'Courier New',monospace;transition:.2s;
  }
  .open-input:focus{outline:none;border-color:var(--nebula);box-shadow:0 0 0 3px rgba(168,85,247,.2);}
  .open-input:disabled{opacity:.6;}
  .open-input.err{border-color:var(--red);animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .open-btn{
    background:linear-gradient(135deg, var(--nebula), #7c3aed);
    color:#fff;border:none;border-radius:10px;padding:12px 22px;
    font-weight:800;font-size:13px;cursor:pointer;transition:.2s;
    font-family:inherit;box-shadow:0 4px 14px rgba(168,85,247,.4);
  }
  .open-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(168,85,247,.6);}
  .open-btn:disabled{opacity:.5;cursor:not-allowed;}
  .fb{
    margin-top:10px;padding:10px 14px;border-radius:8px;
    font-size:13px;font-weight:600;display:none;
  }
  .fb.show{display:block;animation:fadeIn .3s ease;}
  .fb.ok{background:rgba(16,185,129,.15);color:#a7f3d0;border:1px solid rgba(16,185,129,.3);}
  .fb.err{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
  .fb .hint{display:block;margin-top:5px;font-size:12px;color:var(--text-dim);font-style:italic;font-weight:500;}

  /* Memo */
  .memo-area{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    max-width:720px;margin:0 auto;perspective:1000px;
  }
  @media(max-width:600px){.memo-area{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:420px){.memo-area{grid-template-columns:repeat(2,1fr);}}
  .memo-card{
    position:relative;width:100%;padding-bottom:100%;
    cursor:pointer;transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,0,.2,1);
  }
  .memo-card.flipped{transform:rotateY(180deg);}
  .memo-card.matched{animation:memoPop .5s ease;}
  @keyframes memoPop{
    0%{transform:rotateY(180deg) scale(1)}
    50%{transform:rotateY(180deg) scale(1.1)}
    100%{transform:rotateY(180deg) scale(1)}
  }
  .memo-face{
    position:absolute;inset:0;border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    padding:10px;text-align:center;font-size:13px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    font-family:'Courier New',monospace;line-height:1.35;
  }
  .memo-back{
    background:
      radial-gradient(circle at 30% 30%, rgba(251,191,36,.3) 0%, transparent 50%),
      radial-gradient(circle at 70% 70%, rgba(0,217,255,.3) 0%, transparent 50%),
      linear-gradient(135deg, #1a2a44, #0f1524);
    border:2px solid rgba(0,217,255,.4);position:relative;overflow:hidden;
  }
  .memo-back::before{
    content:'✦';position:absolute;font-size:60px;
    color:rgba(0,217,255,.2);top:50%;left:50%;
    transform:translate(-50%,-50%);font-family:Montserrat;
  }
  .memo-front{
    background:linear-gradient(135deg, #fff, #f0f7f6);
    color:var(--space-deep);transform:rotateY(180deg);
    border:2px solid var(--cyan);
  }
  .memo-card.matched .memo-front{
    background:linear-gradient(135deg, var(--gold), #ffce8a);
    border-color:var(--gold);box-shadow:0 0 24px rgba(251,191,36,.6);
  }
  .memo-stats{
    display:flex;gap:16px;justify-content:center;
    margin-top:16px;font-size:13px;color:var(--text-dim);flex-wrap:wrap;
  }
  .memo-stats strong{color:var(--gold);font-size:15px;}

  /* Toast */
  .toast{
    position:fixed;top:20px;left:50%;
    transform:translateX(-50%) translateY(-100px);
    background:linear-gradient(135deg, var(--gold), #f59e0b);
    color:var(--space-deep);padding:14px 26px;border-radius:14px;
    font-weight:800;font-size:14px;
    box-shadow:0 10px 40px rgba(251,191,36,.5);
    transition:transform .4s cubic-bezier(.4,0,.2,1);
    z-index:9999;white-space:nowrap;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.ok{background:linear-gradient(135deg, var(--green), #059669);color:#fff;}
  .toast.err{background:linear-gradient(135deg, var(--red), #dc2626);color:#fff;}

  /* Final */
  .final{
    text-align:center;padding:40px 20px;
    background:linear-gradient(135deg, rgba(0,217,255,.1), rgba(168,85,247,.1));
    border:2px solid var(--cyan);border-radius:24px;
    animation:fadeIn .6s ease;box-shadow:0 0 60px rgba(0,217,255,.2);
  }
  .final .trophy{font-size:88px;margin-bottom:16px;animation:float 3s infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .final h2{color:var(--cyan);font-size:28px;margin-bottom:12px;text-shadow:0 0 30px rgba(0,217,255,.6);}
  .final p{color:var(--text-dim);font-size:15px;margin-bottom:20px;}

  .final-ad{
    margin-top:28px;max-width:520px;margin-left:auto;margin-right:auto;
    background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);
    border-radius:16px;padding:18px 22px;text-align:center;position:relative;
  }
  .final-ad::before{
    content:'НАВИГАТОР СОВЕТУЕТ';position:absolute;top:-9px;left:50%;
    transform:translateX(-50%);background:var(--space-deep);color:var(--gold);
    font-size:9px;font-weight:900;letter-spacing:2px;padding:3px 12px;
    border-radius:8px;border:1px solid rgba(251,191,36,.4);
  }
  .final-ad h4{color:var(--gold);font-size:15px;margin-bottom:6px;font-weight:800;}
  .final-ad p{color:var(--text);font-size:13px;margin-bottom:12px;line-height:1.5;}
  .final-ad a{
    display:inline-flex;align-items:center;gap:6px;

<script>

const game = {

  badges: new Set(),

  startTime: Date.now(),

const RANKS = ['Космический новичок','Пилот звездолёта','Штурман галактики','Капитан флота','Командор сектора','Адмирал вселенной','Легенда космоса','Магистр-навигатор'];

const BADGES = {
  first_blood:{icon:'🎯',name:'Первый шаг',desc:'Решил первую задачу'},
  streak3:{icon:'🔥',name:'Серия из 3',desc:'3 верных подряд'},

/* ============================================================
   ЗВУКИ
   ============================================================ */
let audioCtx = null;
function beep(freq, dur, type, vol){
  if(!game.soundOn) return;
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.08;
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function soundOk(){
  beep(660, 0.08, 'sine', 0.08);
  setTimeout(()=>beep(880, 0.12, 'sine', 0.08), 70);
}
function soundErr(){ beep(180, 0.18, 'sawtooth', 0.06); }
function soundComplete(){
  beep(523, 0.1); setTimeout(()=>beep(659, 0.1), 100);
  setTimeout(()=>beep(784, 0.12), 200);
  setTimeout(()=>beep(1047, 0.2), 320);
}

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function save(){
  try{
    localStorage.setItem('space_poly_v2', JSON.stringify({
      xp: game.xp, level: game.level, maxStreak: game.maxStreak,
      solved: game.solved, errors: game.errors,
      badges: [...game.badges], soundOn: game.soundOn
    }));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem('space_poly_v2') || '{}');
    if(typeof d.xp === 'number') game.xp = d.xp;
    if(typeof d.level === 'number') game.level = d.level;
    if(typeof d.maxStreak === 'number') game.maxStreak = d.maxStreak;
    if(typeof d.solved === 'number') game.solved = d.solved;
    if(typeof d.errors === 'number') game.errors = d.errors;
    if(Array.isArray(d.badges)) game.badges = new Set(d.badges);
    if(typeof d.soundOn === 'boolean') game.soundOn = d.soundOn;
  }catch(e){}
}

/* ============================================================
   XP / LEVEL / BADGES
   ============================================================ */
function addXP(amount, reason){
  game.xp += amount;
  let leveled = false;
  while(game.xp >= game.xpPerLevel){
    game.xp -= game.xpPerLevel;
    game.level++;
    game.xpPerLevel = 100 + (game.level - 1) * 40;
    leveled = true;
  }
  if(reason) toast('+' + amount + ' XP · ' + reason, 'ok');
  if(leveled){
    setTimeout(() => {
      toast('⭐ Уровень ' + game.level + '! ' + RANKS[Math.min(game.level-1, RANKS.length-1)], 'ok');
      if(game.level >= 3) unlockBadge('level3');
      if(game.level >= 5) unlockBadge('level5');
    }, 600);
  }
  save();
  renderHUD();
}

function unlockBadge(id){
  if(game.badges.has(id)) return;
  const b = BADGES[id];
  if(!b) return;
  game.badges.add(id);
  setTimeout(() => toast(b.icon + ' Достижение: ' + b.name, 'ok'), 300);
  save();
  renderHUD();
}

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}

function renderHUD(){
  document.getElementById('xpFill').style.width = (game.xp / game.xpPerLevel * 100) + '%';
  document.getElementById('xpText').textContent = game.xp + ' / ' + game.xpPerLevel + ' XP';
  document.getElementById('xpLevel').textContent = 'Ур. ' + game.level;
  document.getElementById('lvlBadge').textContent = game.level;
  document.getElementById('rankName').textContent = RANKS[Math.min(game.level-1, RANKS.length-1)];
  document.getElementById('hStreak').textContent = game.streak;
  document.getElementById('hSolved').textContent = game.solved;
  document.getElementById('hErrors').textContent = game.errors;
}

function startTimer(){
  if(game.timerInterval) clearInterval(game.timerInterval);
  const start = Date.now();
  game.timerInterval = setInterval(() => {
    const sec = Math.floor((Date.now() - start) / 1000);
    const el = document.getElementById('hTimer');
    if(el) el.textContent = formatTime(sec);
  }, 1000);
}

    else if(tab.type === 'quiz'){ solved = state[tab.solvedSet].size; total = tab.data.length; }
    else if(tab.type === 'open'){ solved = state[tab.solvedSet].size; total = tab.data.length; }
    else if(tab.type === 'memo'){ solved = state.memoMatched.size / 2; total = MEMO_PAIRS.length; }

    const done = solved === total && total > 0;
    const el = document.createElement('div');
    el.className = 'tab' + (state.tab === tab.id ? ' active' : '') + (done ? ' done' : '');
    el.innerHTML = tab.icon + ' ' + tab.name + ' <span class="cnt">' + solved + '/' + total + '</span>';
    el.onclick = () => {
      state.tab = tab.id;
      renderTabs();
      renderStage();
    };
    t.appendChild(el);
  });
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function renderStage(){
  const stage = document.getElementById('stage');
  const tab = TABS.find(t => t.id === state.tab);
  if(!tab) return;

  if(tab.type === 'dnd') renderDND(stage);
  else if(tab.type === 'quiz') renderQuiz(stage, tab);
  else if(tab.type === 'open') renderOpen(stage, tab);
  else if(tab.type === 'memo') renderMemo(stage);
}

/* ============================================================
   DND
   ============================================================ */
function renderDND(stage){
  const remaining = DND_TASKS.filter((_, i) => !state.dndSolved.has(i));

  stage.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>🛸 Выбор метода</h2>
        <p class="sub">Перетащи каждый многочлен в правильный отсек. Или кликни на чип, затем на отсек.</p>
      </div>
      <div class="dnd-intro">
        <strong>💡 Три метода:</strong><br>
        🔹 <b>Вынесение</b> — общий множитель у всех слагаемых<br>
        🔹 <b>ФСУ</b> — разность квадратов, квадрат суммы/разности<br>
        🔹 <b>Группировка</b> — объединяем слагаемые в группы
      </div>
      <div class="dnd-chips" id="dndChips">
        ${remaining.map((task, i) => {
          const realIdx = DND_TASKS.indexOf(task);
          return `<div class="chip" draggable="true" data-idx="${realIdx}">${task.text}</div>`;
        }).join('')}
      </div>
      <div class="dnd-zones">
        <div class="dnd-zone zone-factor" data-method="factor">
          <div class="zone-head">
            <span class="zone-icon">🚀</span>
            <div class="zone-name">Вынесение</div>
            <div class="zone-desc">Общий множитель</div>
          </div>
          <div class="zone-items"></div>
        </div>
        <div class="dnd-zone zone-fsu" data-method="fsu">
          <div class="zone-head">
            <span class="zone-icon">⭐</span>
            <div class="zone-name">ФСУ</div>
            <div class="zone-desc">Формулы сокращённого умножения</div>
          </div>
          <div class="zone-items"></div>
        </div>
        <div class="dnd-zone zone-group" data-method="group">
          <div class="zone-head">
            <span class="zone-icon">🌌</span>
            <div class="zone-name">Группировка</div>
            <div class="zone-desc">Группы слагаемых</div>
          </div>
          <div class="zone-items"></div>
        </div>
      </div>
    </div>
  `;

  const chips = stage.querySelectorAll('.chip');
  const zones = stage.querySelectorAll('.dnd-zone');

  chips.forEach(chip => {
    chip.addEventListener('dragstart', e => {
      state.selectedChip = +chip.dataset.idx;
      chip.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', chip.dataset.idx); } catch(err){}
    });
    chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      state.selectedChip = +chip.dataset.idx;
    });
  });

  zones.forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('over');
      let idx = state.selectedChip;
      try {
        const data = e.dataTransfer.getData('text/plain');
        if(data !== '') idx = +data;
      } catch(err){}
      if(idx === null || idx === undefined) return;
      handleDNDDrop(idx, zone);
    });
    zone.addEventListener('click', () => {
      if(state.selectedChip === null) return;
      handleDNDDrop(state.selectedChip, zone);
    });
  });
}

function handleDNDDrop(idx, zone){
  const task = DND_TASKS[idx];
  if(!task) return;
  const method = zone.dataset.method;

  if(task.method === method){
    state.dndSolved.add(idx);
    state.selectedChip = null;
    game.solved++;
    game.streak++;
    if(game.streak > game.maxStreak) game.maxStreak = game.streak;
    if(game.solved === 1) unlockBadge('first_blood');
    if(game.streak >= 3) unlockBadge('streak3');
    if(game.streak >= 5) unlockBadge('streak5');
    if(game.streak >= 10) unlockBadge('streak10');
    soundOk();
    addXP(15, 'верный метод');
    if(state.dndSolved.size === DND_TASKS.length) unlockBadge('dnd_master');
    renderTabs();
    renderStage();
    save();
  } else {
    game.errors++;
    game.streak = 0;
    soundErr();
    toast('❌ Не тот отсек', 'err');
    save();
    renderHUD();
  }
}

/* ============================================================
   QUIZ
   ============================================================ */
function renderQuiz(stage, tab){
  const solvedSet = state[tab.solvedSet];
  stage.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${tab.icon} ${tab.name}</h2>
        <p class="sub">Выбери правильный ответ. +20 XP за верный.</p>
      </div>
      <div id="quizList"></div>
    </div>
  `;
  const list = document.getElementById('quizList');
  tab.data.forEach((q, i) => {
    const solved = solvedSet.has(i);
    const div = document.createElement('div');
    div.className = 'quiz' + (solved ? ' solved' : '');
    div.innerHTML = `
      <span class="quiz-num">№ ${i + 1}</span>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">
        ${q.opts.map((opt, oi) => `
          <button class="quiz-opt ${solved && oi === q.correct ? 'correct' : ''}"
                  data-q="${i}" data-o="${oi}" ${solved ? 'disabled' : ''}>${opt}</button>
        `).join('')}
      </div>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('.quiz-opt').forEach(btn => {
    if(btn.disabled) return;
    btn.onclick = () => handleQuizAnswer(btn, tab);
  });
}

function handleQuizAnswer(btn, tab){
  const qi = +btn.dataset.q;
  const oi = +btn.dataset.o;
  const q = tab.data[qi];
  const solvedSet = state[tab.solvedSet];
  const quizEl = btn.closest('.quiz');
  const allOpts = quizEl.querySelectorAll('.quiz-opt');
  allOpts.forEach(o => o.disabled = true);

  if(oi === q.correct){
    btn.classList.add('correct');
    solvedSet.add(qi);
    game.solved++;
    game.streak++;
    if(game.streak > game.maxStreak) game.maxStreak = game.streak;
    if(game.solved === 1) unlockBadge('first_blood');
    if(game.streak >= 3) unlockBadge('streak3');
    if(game.streak >= 5) unlockBadge('streak5');
    if(game.streak >= 10) unlockBadge('streak10');
    soundOk();
    addXP(20, 'верно!');
    quizEl.classList.add('solved');
    if(solvedSet.size === tab.data.length) unlockBadge('quiz_master');
    renderTabs();
    setTimeout(() => renderStage(), 800);
  } else {
    btn.classList.add('wrong');
    allOpts[q.correct].classList.add('correct');
    game.errors++;
    game.streak = 0;
    soundErr();
    toast('❌ Неверно', 'err');
    save();
    renderHUD();
  }
}

/* ============================================================
   OPEN
   ============================================================ */
function renderOpen(stage, tab){
  const solvedSet = state[tab.solvedSet];
  stage.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${tab.icon} ${tab.name}</h2>
        <p class="sub">Ответь «да» или «нет». Проверь, лежит ли точка на графике. +15 XP за верный.</p>
      </div>
      <div id="openList"></div>
    </div>
  `;
  const list = document.getElementById('openList');
  tab.data.forEach((t, i) => {
    const solved = solvedSet.has(i);
    const div = document.createElement('div');
    div.className = 'open' + (solved ? ' solved' : '');
    div.innerHTML = `
      <div class="open-q"><b>№ ${i + 1}.</b> ${t.q}</div>
      <div class="open-row">
        <input type="text" class="open-input" placeholder="да / нет" value="${solved ? '✓' : ''}" ${solved ? 'disabled' : ''}>
        <button class="open-btn" ${solved ? 'disabled' : ''}>${solved ? '✓ Решено' : 'Проверить'}</button>
      </div>
      <div class="fb" id="fb-open-${i}"></div>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('.open-input').forEach(inp => {
    if(inp.disabled) return;
    inp.addEventListener('keydown', e => {
      if(e.key === 'Enter') {
        const btn = inp.parentElement.querySelector('.open-btn');
        if(btn && !btn.disabled) btn.click();
      }
    });
  });
  list.querySelectorAll('.open-btn').forEach((btn, i) => {
    if(btn.disabled) return;
    btn.onclick = () => handleOpenAnswer(btn, i, tab);
  });
}

function handleOpenAnswer(btn, i, tab){
  const task = tab.data[i];
  const input = btn.parentElement.querySelector('.open-input');
  const fb = document.getElementById('fb-open-' + i);
  const answer = input.value.trim().toLowerCase();
  const correct = normalizeAnswer(answer) === normalizeAnswer(task.ans);

  fb.classList.add('show');
  if(correct){
    fb.className = 'fb ok show';
    fb.textContent = '✅ Верно! +15 XP';
    input.disabled = true;
    btn.disabled = true;
    btn.textContent = '✓ Решено';
    input.closest('.open').classList.add('solved');
    state[tab.solvedSet].add(i);
    game.solved++;
    game.streak++;
    if(game.streak > game.maxStreak) game.maxStreak = game.streak;
    if(game.solved === 1) unlockBadge('first_blood');
    if(game.streak >= 3) unlockBadge('streak3');
    if(game.streak >= 5) unlockBadge('streak5');
    soundOk();
    addXP(15, 'верно!');
    if(state[tab.solvedSet].size === tab.data.length) unlockBadge('graph_master');
    renderTabs();
  } else {
    fb.className = 'fb err show';
    fb.innerHTML = '❌ Неверно. <span class="hint">💡 ' + task.hint + '</span>';
    input.classList.add('err');
    setTimeout(() => input.classList.remove('err'), 500);
    game.errors++;
    game.streak = 0;
    soundErr();
    save();
    renderHUD();
  }
}

function normalizeAnswer(s){
  let n = String(s).toLowerCase().trim().replace(/\s+/g, '').replace(/ё/g, 'е');
  if(['yes','y','true','1','да','д','+'].includes(n)) return 'да';
  if(['no','n','false','0','нет','н','-'].includes(n)) return 'нет';
  return n;
}

/* ============================================================
   MEMO
   ============================================================ */
function renderMemo(stage){
  // Собираем колоду
  const cards = [];
  MEMO_PAIRS.forEach((p, i) => {
    cards.push({id:i, text:p.a, type:'a'});
    cards.push({id:i, text:p.b, type:'b'});
  });
  // Перемешиваем, но только если ещё не начинали
  if(state.memoOpened.length === 0 && state.memoMatched.size === 0){
    for(let i = cards.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    state.memoCards = cards;
  }
  const deck = state.memoCards || cards;

  stage.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>🧩 Мемо-формулы</h2>
        <p class="sub">Найди пары «формула ↔ разложение». Открывай по 2 карточки. +25 XP за пару.</p>
      </div>
      <div class="memo-area" id="memoArea"></div>
      <div class="memo-stats">
        <span>Ходов: <strong id="memoMoves">0</strong></span>
        <span>Пар: <strong id="memoPairs">0 / ${MEMO_PAIRS.length}</strong></span>
      </div>
    </div>
  `;

  const area = document.getElementById('memoArea');
  deck.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'memo-card' + (state.memoMatched.has(i) ? ' flipped matched' : '');
    el.dataset.index = i;
    el.innerHTML = `
      <div class="memo-face memo-back"></div>
      <div class="memo-face memo-front">${card.text}</div>
    `;
    el.onclick = () => flipMemo(i, el);
    area.appendChild(el);
  });

  document.getElementById('memoPairs').textContent = (state.memoMatched.size / 2) + ' / ' + MEMO_PAIRS.length;
}

function flipMemo(i, el){
  if(state.memoLock) return;
  if(state.memoMatched.has(i)) return;
  if(state.memoOpened.includes(i)) return;
  if(state.memoOpened.length >= 2) return;

  el.classList.add('flipped');
  state.memoOpened.push(i);
  beep(500, 0.04, 'sine', 0.04);

  if(state.memoOpened.length === 2){
    const [i1, i2] = state.memoOpened;
    const c1 = (state.memoCards || [])[i1];
    const c2 = (state.memoCards || [])[i2];
    if(!c1 || !c2) return;

    if(c1.id === c2.id && c1.type !== c2.type){
      setTimeout(() => {
        state.memoMatched.add(i1);
        state.memoMatched.add(i2);
        const el1 = document.querySelector(`.memo-card[data-index="${i1}"]`);
        const el2 = document.querySelector(`.memo-card[data-index="${i2}"]`);
        if(el1) el1.classList.add('matched');
        if(el2) el2.classList.add('matched');
        state.memoOpened = [];
        game.solved++;
        soundOk();
        addXP(25, 'пара в мемо');
        const pairsEl = document.getElementById('memoPairs');
        if(pairsEl) pairsEl.textContent = (state.memoMatched.size / 2) + ' / ' + MEMO_PAIRS.length;
        if(state.memoMatched.size / 2 === MEMO_PAIRS.length){
          unlockBadge('memo_master');
          soundComplete();
        }
        renderTabs();
      }, 400);
    } else {
      state.memoLock = true;
      setTimeout(() => {
        const el1 = document.querySelector(`.memo-card[data-index="${i1}"]`);
        const el2 = document.querySelector(`.memo-card[data-index="${i2}"]`);
        if(el1) el1.classList.remove('flipped');
        if(el2) el2.classList.remove('flipped');
        state.memoOpened = [];
        state.memoLock = false;
        soundErr();
        game.errors++;
        save();
        renderHUD();
      }, 900);
    }
  }
}

/* ============================================================
   ЭКСПОРТ
   ============================================================ */
function exportResult(){
  const area = document.getElementById('printArea');
  const totalAll = DND_TASKS.length + QUIZ_FACTOR.length + QUIZ_FSU.length + QUIZ_GROUP.length + OPEN_TASKS.length + MEMO_PAIRS.length;
  const denom = game.solved + game.errors;
  const accuracy = denom > 0 ? Math.round(game.solved / denom * 100) : 100;

  const rows = [
    ['🛸 Выбор метода', state.dndSolved.size, DND_TASKS.length],
    ['🚀 Вынесение', state.quizFactorSolved.size, QUIZ_FACTOR.length],
    ['⭐ ФСУ', state.quizFsuSolved.size, QUIZ_FSU.length],
    ['🌌 Группировка', state.quizGroupSolved.size, QUIZ_GROUP.length],
    ['📈 Графики', state.openSolved.size, OPEN_TASKS.length],
    ['🧩 Мемо-формулы', state.memoMatched.size / 2, MEMO_PAIRS.length]
  ];

  area.innerHTML = `
    <div style="text-align:center;border-bottom:2px solid #0F1A2E;padding-bottom:14px;margin-bottom:20px;">
      <div style="color:#2AB7A9;font-size:11pt;letter-spacing:3px;font-family:Arial;font-weight:bold;">МЯГКАЯ МАТЕМАТИКА</div>
      <h1 style="font-family:Arial;font-size:22pt;color:#0F1A2E;margin:8px 0;">Результат: Космический тренажёр</h1>
      <p style="color:#666;font-size:11pt;">Дата: ${new Date().toLocaleDateString('ru-RU')}</p>
    </div>
    <div style="display:flex;gap:20px;margin-bottom:20px;">
      <div style="flex:1;border:1pt solid #2AB7A9;border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:24pt;font-weight:900;color:#2AB7A9;">${game.xp + (game.level-1)*100}</div>
        <div style="font-size:10pt;color:#666;">XP</div>
      </div>
      <div style="flex:1;border:1pt solid #F4A261;border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:24pt;font-weight:900;color:#F4A261;">${game.solved}/${totalAll}</div>
        <div style="font-size:10pt;color:#666;">Решено</div>
      </div>
      <div style="flex:1;border:1pt solid #8B5CF6;border-radius:8px;padding:12px;text-align:center;">
        <div style="font-size:24pt;font-weight:900;color:#8B5CF6;">${accuracy}%</div>
        <div style="font-size:10pt;color:#666;">Точность</div>
      </div>
    </div>
    <div style="background:#FFF6EC;padding:14px;border-radius:8px;border-left:4px solid #F4A261;">
      <div style="font-family:Arial;font-size:11pt;font-weight:bold;color:#0F1A2E;margin-bottom:8px;">Прогресс по разделам:</div>
      ${rows.map(([name, solved, total]) => `
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted #ccc;">
          <span>${name}</span>
          <strong>${solved} / ${total}</strong>
        </div>
      `).join('')}
    </div>
    <p style="text-align:center;font-size:10pt;color:#888;margin-top:30px;">Мягкая математика · myagkaya-math.ru</p>
  `;

  setTimeout(() => window.print(), 300);
}

/* ============================================================
   СТАРТ
   ============================================================ */
document.getElementById('soundBtn').onclick = () => {
  game.soundOn = !game.soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = game.soundOn ? '🔊' : '🔇';
  btn.classList.toggle('active', game.soundOn);
  save();
  if(game.soundOn) beep(660, 0.08);
};

document.getElementById('printBtn').onclick = () => exportResult();

load();
renderHUD();
renderTabs();
renderStage();
startTimer();

const soundBtn = document.getElementById('soundBtn');
if(soundBtn) {
  soundBtn.textContent = game.soundOn ? '🔊' : '🔇';
  soundBtn.classList.toggle('active', game.soundOn);
}
</script>

</body>
